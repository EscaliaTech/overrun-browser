name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: bun run test:viewport && bun run test:security

      - name: Build
        run: npm run build

      - name: Electron smoke test
        run: xvfb-run --auto-servernum bun run test:viewport:electron

      - name: Electron smoke test (security)
        run: xvfb-run --auto-servernum bun run test:security:electron
